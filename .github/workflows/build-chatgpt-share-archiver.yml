name: ChatGPT Share Archiver - Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ChatGPT-Share-Archiver/**'
      - '.github/workflows/build-chatgpt-share-archiver.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ChatGPT-Share-Archiver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline regression tests
        shell: pwsh
        run: python -m unittest discover -s tests -v
      - name: Install PyInstaller
        shell: pwsh
        run: python -m pip install pyinstaller==6.16.0
      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name ChatGPT-Share-Archiver --paths scripts --add-data 'assets/chat-ui.html;assets' scripts/app_entry.py
      - name: Smoke test packaged Windows launcher
        shell: pwsh
        run: python tests/smoke_windows_exe.py
      - name: Stop smoke-test background server
        if: always()
        shell: pwsh
        run: |
          Get-NetTCPConnection -LocalAddress 127.0.0.1 -LocalPort 8791 -State Listen -ErrorAction SilentlyContinue |
            ForEach-Object { Stop-Process -Id $_.OwningProcess -Force -ErrorAction SilentlyContinue }
      - name: Package application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/ChatGPT_Share_Archiver/chat_archives | Out-Null
          Copy-Item dist/ChatGPT-Share-Archiver.exe release/ChatGPT_Share_Archiver/
          Copy-Item README.md release/ChatGPT_Share_Archiver/
          Copy-Item -Recurse scripts release/ChatGPT_Share_Archiver/
          Copy-Item -Recurse assets release/ChatGPT_Share_Archiver/
          Compress-Archive -Path release/ChatGPT_Share_Archiver -DestinationPath release/ChatGPT_Share_Archiver_Windows.zip -Force
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Share-Archiver-Windows
          path: ChatGPT-Share-Archiver/release/ChatGPT_Share_Archiver_Windows.zip
          if-no-files-found: error