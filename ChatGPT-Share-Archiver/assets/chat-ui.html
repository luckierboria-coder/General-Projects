<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatGPT 聊天记录查看器</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, "Microsoft YaHei", sans-serif; color: #19252b; background: #f3f6f5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    .app { height: 100vh; display: grid; grid-template-rows: auto minmax(0, 1fr); }
    header { background: #fff; border-bottom: 1px solid #dce5e2; padding: 17px 24px 20px; }
    h1 { margin: 0 0 13px; font-size: 20px; font-weight: 700; }
    .address { display: flex; gap: 10px; max-width: 1200px; }
    .project-row { display: flex; align-items: center; gap: 10px; max-width: 500px; margin-top: 11px; font-size: 14px; }
    .project-row input { max-width: 390px; padding: 8px 12px; }
    input { flex: 1; min-width: 0; padding: 12px 15px; font: inherit; border: 1px solid #b9ccc6; border-radius: 10px; background: #fafcfb; }
    input:focus { outline: 2px solid #81c4af; outline-offset: 1px; }
    button { font: inherit; cursor: pointer; border: 0; border-radius: 10px; padding: 12px 18px; font-weight: 650; }
    button:disabled { cursor: not-allowed; opacity: .48; }
    .load { background: #176e57; color: #fff; white-space: nowrap; }
    .workspace { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 280px; }
    main { overflow-y: auto; padding: 28px clamp(18px, 5vw, 72px) 70px; }
    .chat { max-width: 890px; margin: auto; }
    .empty { margin: min(22vh, 160px) auto; max-width: 620px; text-align: center; color: #536760; line-height: 1.8; }
    .empty strong { display: block; color: #20372f; font-size: 23px; margin-bottom: 8px; }
    .heading { margin: 0 0 26px; padding-bottom: 18px; border-bottom: 1px solid #dce5e2; }
    .heading h2 { margin: 0 0 7px; font-size: 23px; overflow-wrap: anywhere; }
    .muted { color: #61746c; font-size: 13px; }
    .message { margin: 0 0 20px; display: flex; gap: 12px; align-items: flex-start; }
    .avatar { flex: none; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: #dcebe6; color: #176e57; font-size: 12px; font-weight: bold; }
    .message.user .avatar { background: #e1e7f2; color: #385782; }
    .bubble { min-width: 0; width: 100%; border: 1px solid #dfe7e3; background: #fff; border-radius: 14px; padding: 15px 18px; box-shadow: 0 2px 8px #102d1f09; }
    .message.user .bubble { background: #fafdff; }
    .role { color: #425c52; font-size: 13px; font-weight: 700; margin-bottom: 9px; }
    .content { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.65; font-size: 14px; }
    .attachment { margin-top: 10px; padding: 8px 11px; background: #f1f5f3; border-radius: 8px; font-size: 13px; overflow-wrap: anywhere; }
    aside { min-height: 0; overflow-y: auto; border-left: 1px solid #dce5e2; background: #fff; padding: 28px 22px; }
    aside h2 { margin: 0 0 12px; font-size: 17px; }
    .export { background: #176e57; color: #fff; width: 100%; margin: 18px 0 10px; }
    .status { min-height: 70px; line-height: 1.55; overflow-wrap: anywhere; color: #52675e; font-size: 13px; }
    .status.error { color: #ad3535; }
    .fact { border-top: 1px solid #e6ede9; padding: 14px 0; font-size: 13px; line-height: 1.5; }
    .fact b { display: block; font-size: 18px; color: #20372f; }
    .note { color: #71817a; font-size: 12px; line-height: 1.6; margin-top: 12px; }
    @media (max-width: 760px) { .app { height: auto; min-height: 100vh; } .workspace { display: flex; flex-direction: column; } main { min-height: 55vh; overflow: visible; } aside { order: -1; border-left: 0; border-bottom: 1px solid #dce5e2; } .address { flex-wrap: wrap; } .address button { width: 100%; } }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>ChatGPT 聊天记录查看器</h1>
      <form class="address" id="load-form">
        <input id="share-url" type="url" inputmode="url" autocomplete="url" required placeholder="粘贴 /share/UUID 或 /s/cx_... 公开分享链接" aria-label="ChatGPT 分享链接">
        <button class="load" id="load-button" type="submit">打开聊天记录</button>
      </form>
      <div class="project-row"><label for="project-name">项目名称</label><input id="project-name" maxlength="80" placeholder="导出前填写，例如 Ximaira Gateway" aria-label="项目名称"></div>
    </header>
    <div class="workspace">
      <main id="scroll-pane" aria-live="polite"><div class="chat" id="chat"><div class="empty"><strong>粘贴分享链接，开始阅读</strong>上方输入 ChatGPT 公开分享链接。加载后可在这里滚动查看分享中全部可读取的聊天消息。</div></div></main>
      <aside>
        <h2>聊天记录</h2>
        <div id="title" class="muted">尚未加载</div>
        <button class="export" id="export-button" disabled>导出聊天记录为XML</button>
        <div class="status" id="status" role="status">XML 会保存到本应用的聊天档案目录，也会由浏览器下载一份。</div>
        <div class="fact">消息数<b id="count">—</b></div>
        <div class="fact">原始数据项数<b id="rendered-count">—</b></div>
        <div class="note">支持 ChatGPT 普通分享链接与 Codex 共享快照；Codex 原始 JSON 完整保留在 XML 中。附件若只有引用信息，不能自动还原原文件。</div>
      </aside>
    </div>
  </div>
  <script>
    const token = '__LOCAL_CSRF_TOKEN__';
    const form = document.getElementById('load-form');
    const urlInput = document.getElementById('share-url');
    const projectInput = document.getElementById('project-name');
    projectInput.value = localStorage.getItem('chatgpt-share-project') || '';
    const loadButton = document.getElementById('load-button');
    const exportButton = document.getElementById('export-button');
    const status = document.getElementById('status');
    const chat = document.getElementById('chat');
    let loadedId = null;

    function setStatus(message, error = false) {
      status.textContent = message;
      status.classList.toggle('error', error);
    }
    async function api(path, payload) {
      const response = await fetch(path, {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'X-Local-Token': token},
        body: JSON.stringify(payload)
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || '操作失败');
      return result;
    }
    function render(result) {
      chat.replaceChildren();
      const heading = document.createElement('div');
      heading.className = 'heading';
      const title = document.createElement('h2');
      title.textContent = result.title || '未命名聊天记录';
      const source = document.createElement('div');
      source.className = 'muted';
      source.textContent = result.source_url;
      heading.append(title, source);
      chat.append(heading);
      const fragment = document.createDocumentFragment();
      for (const item of result.messages) {
        const row = document.createElement('article');
        row.className = 'message ' + (item.role === 'user' ? 'user' : 'assistant');
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = item.role === 'user' ? '我' : 'AI';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        const role = document.createElement('div');
        role.className = 'role';
        role.textContent = (item.role === 'user' ? '用户' : 'ChatGPT') + ' · #' + item.index;
        const content = document.createElement('div');
        content.className = 'content';
        content.textContent = item.text || (item.nontext_count ? '〔非文字内容〕' : '〔无文字内容〕');
        bubble.append(role, content);
        for (const name of item.attachments) {
          const attachment = document.createElement('div');
          attachment.className = 'attachment';
          attachment.textContent = '附件：' + name + '（分享页未包含原文件）';
          bubble.append(attachment);
        }
        row.append(avatar, bubble);
        fragment.append(row);
      }
      chat.append(fragment);
      document.getElementById('scroll-pane').scrollTop = 0;
      document.getElementById('title').textContent = result.title || '未命名聊天记录';
      document.getElementById('count').textContent = String(result.message_count);
      document.getElementById('rendered-count').textContent = String(result.payload_node_count);
    }
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      loadedId = null;
      chat.innerHTML = '<div class="empty"><strong>正在读取聊天记录…</strong>分享链接较长时需要稍候。</div>';
      document.getElementById('title').textContent = '正在加载';
      document.getElementById('count').textContent = '—';
      document.getElementById('rendered-count').textContent = '—';
      exportButton.disabled = true;
      loadButton.disabled = true;
      loadButton.textContent = '正在读取…';
      setStatus('正在获取公开分享数据，请稍候。');
      try {
        const result = await api('/api/load', {url: urlInput.value.trim()});
        loadedId = result.id;
        render(result);
        exportButton.disabled = false;
        setStatus(`已加载 ${result.message_count} 条可显示消息（${result.payload_node_count} 个原始数据项）。点击按钮可保存 XML。`);
      } catch (error) {
        setStatus(error.message, true);
      } finally {
        loadButton.disabled = false;
        loadButton.textContent = '打开聊天记录';
      }
    });
    exportButton.addEventListener('click', async () => {
      if (!loadedId) return;
      const project = projectInput.value.trim();
      if (!project) {
        setStatus('请先填写项目名称，再导出 XML。', true);
        projectInput.focus();
        return;
      }
      exportButton.disabled = true;
      setStatus('正在保存 XML…');
      try {
        const result = await api('/api/export', {id: loadedId, project});
        localStorage.setItem('chatgpt-share-project', project);
        setStatus('已保存至：' + result.saved_path);
        const link = document.createElement('a');
        link.href = result.download_url;
        link.click();
      } catch (error) {
        setStatus(error.message, true);
      } finally {
        exportButton.disabled = false;
      }
    });
  </script>
</body>
</html>
